openapi: 3.1.0
info:
  title: Booksim Runner
  description: Run NoC simulations via Booksim using natural language-generated configs.
  version: 1.0.0
servers:
  - url: https://bookin-wgvp.onrender.com
paths:
  /run-generated-config:
    post:
      summary: Run Generated Config
      operationId: run_generated_config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeneratedConfigRequest'
      responses:
        '200':
          description: Simulation output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
        - ApiKeyAuth: []

  /openapi.yaml:
    get:
      summary: Serve OpenAPI Yaml
      operationId: serve_openapi_yaml
      responses:
        '200':
          description: OpenAPI file served
          content:
            text/plain:
              schema:
                type: string

  /logo.png:
    get:
      summary: Get Logo
      operationId: get_logo
      responses:
        '200':
          description: Logo file served
          content:
            image/png:
              schema:
                type: string
                format: binary

  /legal:
    get:
      summary: Legal Info
      operationId: get_legal_info
      responses:
        '200':
          description: Legal info
          content:
            application/json:
              schema: {}

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization

  schemas:
    GeneratedConfigRequest:
      type: object
      title: GeneratedConfigRequest
      required:
        - config_str
      properties:
        config_str:
          type: string
          title: Config Str

    SimulationResponse:
      type: object
      title: SimulationResponse
      properties:
        output:
          type: string
        errors:
          type: string

    HTTPValidationError:
      type: object
      title: HTTPValidationError
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      required:
        - loc
        - msg
        - type
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
